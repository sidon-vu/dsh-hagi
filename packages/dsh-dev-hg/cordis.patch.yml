# Mỗi item dưới đây là MỘT row = MỘT tính năng. Row id là hợp đồng vĩnh viễn:
# mọi patch máy (control/profiles/<máy>/) trỏ vào id, nên không đổi tên.
- insert:
    # Công cụ cho agent: quét lỗ hổng bản địa hoá của plugin đã cài.
    # Tên row trỏ tới file tương đối cạnh file patch này (loader hỗ trợ).
    - id: dev-hg-i18n-audit
      name: './src/tool.js'

    # Khoá chạy mỗi tool call: chặn đường dẫn bảo vệ, lệnh phá huỷ, secret.
    # Mặc định TẮT trong package vì nó ảnh hưởng mọi lời gọi tool — bật ở
    # control/profiles/<máy>/cordis.patch.yml (kèm config riêng của máy).
    - id: dev-hg-guard
      name: './src/guard.js'
      disabled: true

    # Công cụ so trạng thái mong muốn (patch của máy) với máy: bundle thiếu, link
    # gãy, version lệch, row bị tắt nhầm. Chỉ đọc nên bật mặc định.
    - id: dev-hg-doctor
      name: './src/doctor-tool.js'

    # Đóng gói / dựng lại profile: export một manifest JSON không credentials,
    # import dựng lại thư mục profile. Chỉ đọc khi export; import có dry-run.
    - id: dev-hg-snapshot
      name: './src/snapshot-tool.js'

    # Undo một bước cho profile: save checkpoint vào rollback-history.json,
    # restore đưa về snapshot gần nhất (dry-run trừ khi confirm).
    - id: dev-hg-rollback
      name: './src/rollback-tool.js'

    # --- thêm tính năng mới theo mẫu ---
    # - id: dev-hg-<tên-tính-năng>
    #   name: './src/<file>.js'
    #   disabled: true      # mặc định tắt khi còn thử nghiệm
