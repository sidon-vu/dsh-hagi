# Patch mẫu cho một máy. Copy thành workbench/profiles/<máy>/cordis.patch.yml
# rồi chép nội dung vào ~/.dsh/profiles/<profile>/cordis.patch.yml (thêm ở cuối file).

# 1) Marketplace của chính repo này (index của marketplace)
- id: plugin-market
  config:
    indexes:
      - https://raw.githubusercontent.com/sidon-vu/dsh-hagi/main/index.json

# 2) Tính năng bật/tắt theo máy
#    Row id lấy từ docs/TRACKING.md. disabled: true = tắt, null = theo mặc định package.

# máy chính: bật hết dev tool
- id: dev-hg-doctor
  disabled: null

# máy chủ/box: không cần panel UI nặng
- id: ui-hg-density
  disabled: true

# 3) Đổi config: phải restate TOÀN BỘ field của row (không deep-merge)
# - id: dev-hg-doctor
#   config:
#     checkIntervalMinutes: 30
#     notifyOnDrift: true
