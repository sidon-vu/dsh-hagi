# Patch mẫu cho một máy. Copy thành workbench/profiles/<máy>/cordis.patch.yml
# rồi chép nội dung vào ~/.dsh/profiles/<profile>/cordis.patch.yml (thêm ở cuối file).

# 1) Marketplace của chính repo này
- id: plugin-market
  config:
    indexes:
      - https://raw.githubusercontent.com/sidon-vu/dsh-hagi/main/index.json

# 2) Khoá guard: bật + khai luật riêng của workspace này.
#    `config` thay thế wholesale → mỗi máy phải ghi đủ field nó cần.
#    Luật mặc định trong code vẫn chạy (trừ khi disableDefaults: true).
- id: dev-hg-guard
  disabled: null
  config:
    protectedPaths:
      - pattern: 'research/inbox/**'
        allow:
          - 'research/inbox/**/_quarantine/**'
          - 'research/inbox/**/ANALYSIS.md'
          - 'research/inbox/**/NOTICE.md'
        why: 'research/inbox là bằng chứng read-only'
      - pattern: 'dsh-hagi/index.json'
        why: 'index.json chỉ do scripts/build-index.mjs ghi'
    denyCommands:
      # xoá tag làm index trỏ vào commit không còn — cài đặt của máy khác gãy
      - pattern: 'git\s+tag\s+-d\b'
        why: 'tag đã phát hành là hợp đồng với index.json'

# 3) Tính năng bật/tắt theo máy (row id lấy từ docs/TRACKING.md)
- id: dev-hg-doctor
  disabled: null

# máy chủ/box: không cần panel UI nặng
- id: ui-hg-density
  disabled: true

